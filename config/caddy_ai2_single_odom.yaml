# config/caddy_ai2_single_odom.yaml
# ──────────────────────────────────────────────────────────────────────────────
# Escenario A — Robot único, sin localizador (solo odometría)
#
# Árbol TF de ROS:
#   caddy_ai2/odom → caddy_ai2/base_footprint
#
# TF publicada:
#   world → caddy_ai2/odom   (corrección de la deriva de odometría)
#
# Uso:
#   ros2 launch gz_ground_truth single_odom.launch.py
#   ros2 run gz_ground_truth ground_truth_tf_publisher \
#       --ros-args --params-file config/caddy_ai2_single_odom.yaml
# ──────────────────────────────────────────────────────────────────────────────
ground_truth_tf_publisher:
  ros__parameters:
    use_sim_time: true
    multi_robot: false

    gz_model_name: caddy_ai2
    tf_prefix: caddy_ai2

    ground_truth_frame: world
    base_suffix: base_footprint
    localization_frame: caddy_ai2/odom

    publish_rate: 50.0
